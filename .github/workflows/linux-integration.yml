name: Linux integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      bindings-ref:
        description: Exact bindings commit/tag to validate
        required: false
        type: string

permissions:
  contents: read

# The consumers are built the way a person builds them: the bindings, the
# consumer repository and an upstream checkout as siblings, then upstream's
# own make. MicroPython takes the consumer's manifest (its c_module() line
# names the usermod); CircuitPython takes the consumer's apply script, which
# copies its shared-bindings/shared-module into the tree. No aggregator.
jobs:
  embedded-unix:
    name: ${{ matrix.runtime }} Unix build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [micropython, circuitpython]
    steps:
      - name: Check out bindings under test
        uses: actions/checkout@v7
        with:
          path: integration/lvgl-bindings
          ref: ${{ inputs['bindings-ref'] || github.sha }}
          submodules: recursive

      - name: Check out MicroPython consumer
        if: matrix.runtime == 'micropython'
        uses: actions/checkout@v7
        with:
          repository: PyDevices/lvgl-micropython
          ref: 5562012a160465770aa5f4389dd41d6bb25eb2ef
          path: integration/lvgl-micropython

      - name: Check out MicroPython v1.29.0
        if: matrix.runtime == 'micropython'
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: v1.29.0
          path: integration/micropython

      - name: Check out CircuitPython consumer
        if: matrix.runtime == 'circuitpython'
        uses: actions/checkout@v7
        with:
          repository: PyDevices/lvgl-circuitpython
          ref: d1bd6defdaef5856827051be69bf453ad8f46013
          path: integration/lvgl-circuitpython

      - name: Check out CircuitPython 10.3.0
        if: matrix.runtime == 'circuitpython'
        uses: actions/checkout@v7
        with:
          repository: adafruit/circuitpython
          ref: 10.3.0
          path: integration/circuitpython

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev pkg-config

      - name: Pin the consumer at the exact bindings checkout
        working-directory: integration
        run: |
          bindings_sha=$(git -C lvgl-bindings rev-parse HEAD)
          if [[ "${{ matrix.runtime }}" == micropython ]]; then
            printf '%s\n' "$bindings_sha" > lvgl-micropython/LVGL_BINDINGS_COMMIT
          else
            printf '%s\n' "$bindings_sha" > lvgl-circuitpython/LVGL_BINDINGS_COMMIT
          fi

      - name: Build MicroPython Unix
        if: matrix.runtime == 'micropython'
        working-directory: integration/micropython
        # c_module() in the consumer's manifest needs micropython-lib in the
        # tree; the rest of the port's submodules come from `make submodules`.
        run: |
          git submodule update --init lib/micropython-lib
          make -C mpy-cross -j"$(nproc)"
          make -C ports/unix submodules
          make -C ports/unix -j"$(nproc)" FROZEN_MANIFEST="$GITHUB_WORKSPACE/integration/lvgl-micropython/manifest.py"

      - name: Smoke MicroPython Unix
        if: matrix.runtime == 'micropython'
        working-directory: integration
        run: ./micropython/ports/unix/build-standard/micropython ./lvgl-bindings/tools/test_lvgl_smoke.py

      - name: Fetch CircuitPython submodules
        if: matrix.runtime == 'circuitpython'
        working-directory: integration/circuitpython
        # The unix build needs extmod/ulab, tools/huffman, and the lib/
        # submodules; 'tests' is upstream CI's unix target.
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/ci_fetch_deps.py tests

      - name: Build CircuitPython Unix
        if: matrix.runtime == 'circuitpython'
        working-directory: integration
        env:
          CP_DIR: ${{ github.workspace }}/integration/circuitpython
          WORKSPACE_DIR: ${{ github.workspace }}/integration
        run: |
          ./lvgl-circuitpython/apply_cp_patches.sh --apply --port unix --variant coverage
          make -C circuitpython/mpy-cross -j"$(nproc)"
          make -C circuitpython/ports/unix VARIANT=coverage submodules
          make -C circuitpython/ports/unix -j"$(nproc)" VARIANT=coverage \
              FROZEN_MANIFEST="$GITHUB_WORKSPACE/integration/lvgl-circuitpython/manifest.py"

      - name: Smoke CircuitPython Unix
        if: matrix.runtime == 'circuitpython'
        working-directory: integration
        run: ./circuitpython/ports/unix/build-coverage/micropython ./lvgl-bindings/tools/test_lvgl_smoke.py

  cpython:
    name: CPython extension build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out bindings under test
        uses: actions/checkout@v7
        with:
          path: lvgl-bindings
          ref: ${{ inputs.bindings-ref || github.sha }}
          submodules: recursive

      - name: Check out CPython consumer
        uses: actions/checkout@v7
        with:
          repository: PyDevices/lvgl-python
          ref: 7883313f802d891232fe6af0c8cd1e362d4662f6
          path: lvgl-python
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync the exact bindings commit under test
        working-directory: lvgl-python
        env:
          LV_BINDINGS_REPO: ${{ github.workspace }}/lvgl-bindings
        run: ./scripts/sync_from_lvgl_bindings.sh --ref "${{ inputs['bindings-ref'] || github.sha }}"

      - name: Build and test extension
        working-directory: lvgl-python
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python ../lvgl-bindings/tools/test_lvgl_smoke.py
