name: Generator checks

# Documentation-only changes can't change this result, so they don't run it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and LVGL
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run generator unit tests
        run: PYTHONPATH=. python -m pytest -q tests

      - name: Verify reproducible generated artifacts
        run: ./scripts/verify_bindings.sh

      - name: Print generated artifact hashes
        run: PYTHONPATH=. python tools/hash_artifacts.py generated
