# Read the Docs builds the LVGL documentation site (lvgl-bindings, lvgl-python,
# lvgl-micropython and lvgl-circuitpython share it) from this file.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
